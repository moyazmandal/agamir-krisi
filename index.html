<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DeltaPulse – SAR flood, crop and erosion watch</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#12303a;--mute:#566f7b;--line:#cfdbe0;--acc:#1f78c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--card:#162830;--ink:#e3eef2;--mute:#92aab5;--line:#294550;--acc:#5db3ff}}
:root[data-theme="dark"]{--bg:#0e1a20;--card:#162830;--ink:#e3eef2;--mute:#92aab5;--line:#294550;--acc:#5db3ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Hind Siliguri',system-ui,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{margin:0;font-size:2rem;letter-spacing:-.5px}h2{margin:0 0 8px;font-size:1.05rem}
p{margin:.2rem 0}.mute{color:var(--mute);font-size:.9rem}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.demo{margin:10px 0;padding:8px 12px;border-left:4px solid #f0902a;background:var(--card);border-radius:6px;font-size:.9rem}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:96/60;background:#cdd6c4}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#cA{clip-path:inset(0 0 0 50%)}.dv{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 1px #0005;pointer-events:none}
.tg{position:absolute;top:8px;background:#000a;color:#fff;font-size:.8rem;padding:2px 8px;border-radius:5px}.l{left:8px}.r{right:8px}
#cmp{width:100%;margin:8px 0}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin-bottom:14px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:1}
label{display:block;font-size:.88rem;color:var(--mute)}
.big{font-size:1.5rem;font-weight:700}.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
pre,textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 ui-monospace,monospace;overflow-x:auto}
a{color:var(--acc)}ul{padding-left:18px;margin:6px 0}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="wrap">
<header><div><h1>DeltaPulse</h1><p data-k="tag"></p></div><div class="row" style="flex:none"><button id="en">EN</button><button id="bn">বাংলা</button></div></header>
<div class="demo" data-k="demo"></div>
<div class="grid"><section>
<div class="map"><canvas id="cB" width="96" height="60"></canvas><canvas id="cA" width="96" height="60"></canvas><div class="dv" id="dv"></div><span class="tg l" id="bl"></span><span class="tg r" id="al"></span></div>
<input type="range" id="cmp" min="0" max="100" value="50" aria-label="Before / After">
<div class="leg"><span><i style="background:#26568c"></i><span data-k="perm"></span></span><span><i style="background:#35a7ff"></i><span data-k="nw"></span></span><span><i style="background:#f0902a"></i><span data-k="cd"></span></span><span><i style="background:#d23a2e"></i><span data-k="er"></span></span></div>
<div class="card"><h2 data-k="trend"></h2><svg id="ch" viewBox="0 0 300 90" width="100%" role="img"></svg><p class="mute" id="av"></p></div>
</section><aside>
<div class="card"><div class="row"><div><label for="dk" data-k="dist"></label><select id="dk" style="width:100%"></select></div></div>
<label for="day" id="dl"></label><input type="range" id="day" min="121" max="273" value="226" style="width:100%">
<div class="row"><button id="play" class="pri"></button></div></div>
<div class="card"><div class="st"><div><div class="big" id="s1"></div><span class="mute" data-k="a1"></span></div><div><div class="big" id="s2"></div><span class="mute" data-k="a2"></span></div><div><div class="big" id="s3"></div><span class="mute" data-k="a3"></span></div><div><div class="big" id="s4"></div><span class="mute" data-k="a4"></span></div></div>
<label style="margin-top:10px"><span data-k="conf"></span> <span id="cv"></span></label><div class="bar"><b id="cb"></b></div><p class="mute" id="meta"></p></div>
<div class="card"><h2 data-k="ins"></h2><p id="insight"></p></div>
<div class="card"><div class="row"><button id="cr" data-k="cr"></button><button id="cl" data-k="cl"></button></div><textarea id="rep" rows="6" readonly aria-label="Report"></textarea><p class="mute" id="msg"></p></div>
</aside></div>
<div class="card"><h2 data-k="src"></h2><ul>
<li><a href="https://search.asf.alaska.edu/" target="_blank" rel="noopener">ASF Vertex</a> – NISAR L-band, free</li>
<li><a href="https://search.earthdata.nasa.gov/" target="_blank" rel="noopener">NASA Earthdata Search</a></li>
<li><a href="https://docs.asf.alaska.edu/" target="_blank" rel="noopener">ASF docs / asf_search</a></li>
<li><a href="https://dataspace.copernicus.eu/" target="_blank" rel="noopener">Copernicus Data Space</a> – Sentinel-1 baseline before 17 Jun</li>
<li><a href="https://www.ffwc.gov.bd/" target="_blank" rel="noopener">FFWC Bangladesh</a> – river gauges &amp; forecasts</li>
<li><a href="https://global-surface-water.appspot.com/" target="_blank" rel="noopener">JRC Global Surface Water</a> · <a href="https://worldcover2021.esa.int/" target="_blank" rel="noopener">ESA WorldCover</a> – permanent water &amp; cropland masks</li></ul>
<h2 data-k="pipe"></h2><pre id="code"></pre></div>
</div>
<script>
const W=96,H=60,A0=121,NISAR=168;
const D={kurigram:{n:['Kurigram','কুড়িগ্রাম'],b:[89.4,25.5,89.95,26.1],s:3,i:.85,p:226,e:.9},gaibandha:{n:['Gaibandha','গাইবান্ধা'],b:[89.3,25,89.8,25.5],s:7,i:.7,p:222,e:.7},sirajganj:{n:['Sirajganj','সিরাজগঞ্জ'],b:[89.4,24.2,89.9,24.8],s:11,i:.8,p:230,e:1},sunamganj:{n:['Sunamganj','সুনামগঞ্জ'],b:[90.9,24.7,91.7,25.2],s:19,i:.75,p:190,e:.4}};
const T={en:{tag:"See floods, farmland damage and river erosion from space – through clouds, day or night.",demo:"Demo data: a synthetic scenario, not real NISAR imagery. Swap in ASF products with the pipeline below.",perm:"River (usual)",nw:"New water / flood",cd:"Likely crop disturbance (checkered = flooded fields)",er:"River-bank erosion risk",trend:"Flood extent through the season",dist:"District",a1:"km² possibly flooded",a2:"ha farmland possibly affected",a3:"km² erosion-risk bank",a4:"% of map frame under water",conf:"Confidence",ins:"What this means",cr:"Copy report",cl:"Copy link",src:"Real data sources",pipe:"Fetch real NISAR scenes for this district",play:"▶ Play season",pause:"❚❚ Pause",before:"Before: 1 May",date:"Date",ok:"Copied.",no:"Select the text and copy it manually.",lo:"No large flooding signal yet. Keep watching low-lying chars along the river.",mi:"Water is rising on low land and chars. Prepare to move seed, livestock and key items to higher ground.",hi:"Large areas may be flooded. Follow local administration and FFWC warnings.",chk:"This is potential change – verify on the ground.",s1:"Sentinel-1 baseline (C-band)",s2:"NISAR L-band",note:"NISAR public data starts 17 Jun 2026; earlier dates use a Sentinel-1 baseline.",rep:"DeltaPulse report"},
bn:{tag:"মেঘ বা রাত যা-ই হোক, মহাকাশ থেকে বন্যা, ফসলের ক্ষতি ও নদীভাঙন দেখুন।",demo:"ডেমো ডেটা: এটি কৃত্রিম দৃশ্যকল্প, বাস্তব NISAR ছবি নয়। নিচের পাইপলাইনে ASF ডেটা বসান।",perm:"নদী (স্বাভাবিক)",nw:"নতুন পানি / বন্যা",cd:"সম্ভাব্য ফসলের ক্ষতি (চেক = প্লাবিত জমি)",er:"নদীভাঙন ঝুঁকি",trend:"মৌসুমজুড়ে বন্যার বিস্তার",dist:"জেলা",a1:"বর্গকিমি সম্ভাব্য প্লাবিত",a2:"হেক্টর কৃষিজমি ক্ষতিগ্রস্ত হতে পারে",a3:"বর্গকিমি ভাঙনপ্রবণ তীর",a4:"% এলাকা পানির নিচে",conf:"আস্থার মাত্রা",ins:"এর অর্থ কী",cr:"প্রতিবেদন কপি",cl:"লিংক কপি",src:"বাস্তব ডেটার উৎস",pipe:"এই জেলার আসল NISAR ছবি আনুন",play:"▶ মৌসুম চালান",pause:"❚❚ থামান",before:"আগে: ১ মে",date:"তারিখ",ok:"কপি হয়েছে।",no:"লেখাটি বেছে নিয়ে নিজে কপি করুন।",lo:"এখনও বড় বন্যার লক্ষণ কম। নদীর তীরের নিচু চর পর্যবেক্ষণে রাখুন।",mi:"নিচু জমি ও চরে পানি বাড়ছে। বীজ, গবাদিপশু ও জরুরি জিনিস উঁচু জায়গায় সরানোর প্রস্তুতি নিন।",hi:"বিস্তীর্ণ এলাকা প্লাবিত হতে পারে। স্থানীয় প্রশাসন ও বন্যা পূর্বাভাস কেন্দ্রের (FFWC) সতর্কবার্তা অনুসরণ করুন।",chk:"এটি সম্ভাব্য পরিবর্তন; মাঠ পর্যায়ে যাচাই করুন।",s1:"Sentinel-1 ভিত্তি (C-band)",s2:"NISAR L-band",note:"NISAR-এর প্রকাশ্য ডেটা ১৭ জুন ২০২৬ থেকে; আগের তারিখে Sentinel-1 ভিত্তি ব্যবহৃত।",rep:"ডেল্টাপালস প্রতিবেদন"}};
let L8='en',dk='kurigram',day=226,E,C,Dd,N,flood=[],timer=null;
const $=id=>document.getElementById(id),tr=k=>T[L8][k];
const h=(i,j,s)=>{const n=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y,s)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return h(i,j,s)*(1-u)*(1-v)+h(i+1,j,s)*u*(1-v)+h(i,j+1,s)*(1-u)*v+h(i+1,j+1,s)*u*v};
const g=(t,m,s)=>Math.exp(-.5*((t-m)/s)**2);
const lvl=t=>Math.min(.95,.04+D[dk].i*.75*(.55*g(t,190,16)+g(t,D[dk].p,22)));
const prog=t=>{const x=Math.min(1,Math.max(0,(t-A0)/150));return x*x*(3-2*x)*D[dk].e};
const num=(x,d=0)=>x.toLocaleString(L8=='bn'?'bn-BD':'en-US',{maximumFractionDigits:d});
const fd=t=>new Date(2026,0,t).toLocaleDateString(L8=='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short'});
function build(){const s=D[dk].s;E=new Float32Array(W*H);C=new Uint8Array(W*H);Dd=new Float32Array(W*H);N=new Float32Array(W*H);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=x/W*6.283,yA=H*(.42+.1*Math.sin(u*1.3+s)+.05*Math.sin(u*3.1+s*2)),yB=yA+9+4*Math.sin(u*2+s),d=Math.min(Math.abs(y-yA),Math.abs(y-yB)),i=y*W+x;
Dd[i]=d;E[i]=Math.max(.02,.08+d*.04+(vn(x/9,y/9,s)-.5)*.3);C[i]=vn(x/12,y/12,s+3)>.4&&E[i]>.14?1:0;N[i]=vn(x/6,y/6,s+7)*.6+vn(x/3,y/3,s+9)*.4}
flood=[];for(let t=A0;t<=273;t++){const L=lvl(t);let n=0;for(let i=0;i<W*H;i++)if(Dd[i]>=1.4&&E[i]<L)n++;flood.push(n/(W*H)*100)}}
const PAL=[[217,222,201],[183,208,152],[38,86,140],[53,167,255],0,[240,144,42],[210,58,46]];
function cls(i,L,P){const d=Dd[i];if(d<1.4)return 2;if(P>.04&&d<2.6+4*P*N[i]&&N[i]>.5)return 6;if(E[i]<L)return C[i]?4:3;if(C[i]&&E[i]<L+.07)return 5;return C[i]?1:0}
function draw(cv,t){const L=lvl(t),P=prog(t),c=cv.getContext('2d'),im=c.createImageData(W,H),r={nw:0,cf:0,cd:0,er:0,near:0};
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,k=cls(i,L,P);let p=k==4?((x+y)&1?PAL[3]:PAL[5]):PAL[k];const sh=k<2?.93+E[i]*.1:1;
if(k==3)r.nw++;else if(k==4)r.cf++;else if(k==5)r.cd++;else if(k==6)r.er++;if(k!=2&&Math.abs(E[i]-L)<.03)r.near++;
im.data.set([p[0]*sh,p[1]*sh,p[2]*sh,255],i*4)}c.putImageData(im,0,0);return r}
function km2(){const b=D[dk].b,la=(b[1]+b[3])/2;return(b[2]-b[0])*111.32*Math.cos(la*Math.PI/180)*(b[3]-b[1])*110.57/(W*H)}
function render(){draw($('cB'),A0);const r=draw($('cA'),day),A=km2(),fl=(r.nw+r.cf)*A,crop=(r.cf+r.cd)*A*100,er=r.er*A,pct=(r.nw+r.cf)/(W*H)*100,
conf=Math.round(100*Math.max(.4,(day>=NISAR?.88:.7)-Math.min(.2,8*r.near/(W*H))));
$('s1').textContent=num(fl);$('s2').textContent=num(crop);$('s3').textContent=num(er,1);$('s4').textContent=num(pct,1);
$('cv').textContent=num(conf)+'%';$('cb').style.width=conf+'%';
const src=day>=NISAR?tr('s2'):tr('s1');$('meta').textContent=src+' · '+fd(day)+' 2026 · '+(L8=='bn'?'ডেমো':'demo');
const lv=pct<8?'lo':pct<22?'mi':'hi';$('insight').textContent=tr(lv)+' '+tr('chk');
$('dl').textContent=tr('date')+': '+fd(day);$('al').textContent=fd(day);$('bl').textContent=tr('before');$('av').textContent=tr('note');
const mx=Math.max(...flood,1),pts=flood.map((v,i)=>(i/152*300).toFixed(1)+','+(80-v/mx*70).toFixed(1)).join(' '),mxp=(day-A0)/152*300,nx=(NISAR-A0)/152*300;
$('ch').innerHTML=`<rect x="${nx}" y="0" width="${300-nx}" height="80" fill="#35a7ff" opacity=".12"/><polyline points="${pts}" fill="none" stroke="#1f78c8" stroke-width="2"/><line x1="${mxp}" x2="${mxp}" y1="0" y2="80" stroke="#d23a2e" stroke-width="2"/><text x="4" y="88" font-size="9" fill="currentColor">${fd(A0)}</text><text x="296" y="88" font-size="9" text-anchor="end" fill="currentColor">${fd(273)}</text>`;
const b=D[dk].b,wkt=`POLYGON((${b[0]} ${b[1]},${b[2]} ${b[1]},${b[2]} ${b[3]},${b[0]} ${b[3]},${b[0]} ${b[1]}))`;
$('code').textContent=`import asf_search as asf\nwkt = "${wkt}"\nres = asf.search(dataset=asf.DATASET.NISAR, intersectsWith=wkt,\n                 start="2026-06-17", end="2026-09-30")\nprint(len(res))  # then compute water/backscatter change`;
$('rep').value=`${tr('rep')} – ${D[dk].n[L8=='bn'?1:0]}, ${fd(day)} 2026\n${tr('a1')}: ${num(fl)}\n${tr('a2')}: ${num(crop)}\n${tr('a3')}: ${num(er,1)}\n${tr('conf')}: ${conf}%\n${tr(lv)}\n${tr('chk')}\n${$('meta').textContent}`;
try{history.replaceState(null,'',`#k=${dk}&t=${day}&l=${L8}`)}catch(e){}}
function lang(l){L8=l;document.documentElement.lang=l;$('en').className=l=='en'?'on':'';$('bn').className=l=='bn'?'on':'';
document.querySelectorAll('[data-k]').forEach(e=>e.textContent=tr(e.dataset.k));
$('dk').innerHTML=Object.keys(D).map(k=>`<option value="${k}"${k==dk?' selected':''}>${D[k].n[l=='bn'?1:0]}</option>`).join('');$('play').textContent=timer?tr('pause'):tr('play');render()}
async function cp(t){try{await navigator.clipboard.writeText(t);$('msg').textContent=tr('ok')}catch(e){$('rep').select();$('msg').textContent=tr('no')}}
$('en').onclick=()=>lang('en');$('bn').onclick=()=>lang('bn');
$('dk').onchange=e=>{dk=e.target.value;build();render()};
$('day').oninput=e=>{day=+e.target.value;render()};
$('cmp').oninput=e=>{const v=e.target.value;$('dv').style.left=v+'%';$('cA').style.clipPath=`inset(0 0 0 ${v}%)`};
$('cr').onclick=()=>cp($('rep').value);$('cl').onclick=()=>cp(location.href);
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>{day=day>=273?A0:day+1;$('day').value=day;render()},110);$('play').textContent=timer?tr('pause'):tr('play')};
const q=new URLSearchParams(location.hash.slice(1));if(D[q.get('k')])dk=q.get('k');if(+q.get('t')>=A0&&+q.get('t')<=273){day=+q.get('t');$('day').value=day}
build();lang(q.get('l')=='bn'?'bn':'en');
</script></body></html>
